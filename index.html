
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vibemart.pk - Online Shopping</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f6fa;color:#222}
header{background:#fff;padding:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:0 2px 8px #ddd;position:sticky;top:0;z-index:3}
.logo{font-size:23px;font-weight:bold;color:#673de6}
input,textarea,select{padding:11px;border:1px solid #ddd;border-radius:8px;width:100%;margin:5px 0;font:inherit}
button{border:0;padding:10px 13px;border-radius:8px;background:#673de6;color:white;cursor:pointer;font-weight:bold;margin:3px}
button:disabled{background:#aaa;cursor:not-allowed}
.secondary{background:#eee;color:#333}
.danger{background:#c62828}
.search{flex:1;min-width:150px}
main{max-width:1150px;margin:auto;padding:15px}
.hero,.panel{background:white;padding:18px;border-radius:12px;margin-bottom:15px}
.categories{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.categories button{background:white;color:#333;border:1px solid #ddd}
.categories button.active{background:#673de6;color:white}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.card{background:white;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px #ddd}
.card img{width:100%;height:175px;object-fit:cover;background:#eee}
.body{padding:12px}
.body h3{margin:3px 0 8px;font-size:17px}
.price{font-size:20px;font-weight:bold}
.old{text-decoration:line-through;color:#888;font-size:13px}
.sale{color:#d22;font-size:12px;font-weight:bold}
.stock{font-size:12px;color:green;margin:7px 0}
.low{color:#a60}.out{color:#c22}
.actions{display:flex;flex-wrap:wrap;gap:3px}
.actions button{flex:1}
.hidden{display:none!important}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>*{flex:1}
.small{font-size:12px;color:#777}
.modal{position:fixed;inset:0;background:#0008;z-index:10;display:grid;place-items:center;padding:12px}
.modalbox{background:white;border-radius:14px;padding:18px;width:min(520px,100%);max-height:90vh;overflow:auto}
.modalhead{display:flex;justify-content:space-between;align-items:center}
.item{border-bottom:1px solid #eee;padding:10px 0}
.notice{padding:10px;background:#fff0d0;border-radius:8px;margin:10px 0}
footer{text-align:center;padding:25px;color:#777}
</style>
</head>
<body>
<header>
<div class="logo">Vibemart.pk</div>
<input id="search" class="search" placeholder="Search products...">
<button class="secondary" id="wishBtn">♡ Wishlist <span id="wishCount">0</span></button>
<button id="cartBtn">Cart <span id="cartCount">0</span></button>
<button class="secondary" id="ownerBtn">Owner</button>
</header>

<main>
<section class="hero">
<h2>Welcome to Vibemart.pk 🛍️</h2>
<p>Affordable products delivered to your door. Cash on delivery available.</p>
<div class="categories" id="categories">
<button class="active" data-cat="All">All</button>
<button data-cat="Fashion">Fashion</button>
<button data-cat="Home">Home</button>
<button data-cat="Beauty">Beauty</button>
<button data-cat="Accessories">Accessories</button>
<button data-cat="Other">Other</button>
</div>
<div id="message"></div>
</section>

<section id="products" class="grid">Loading products...</section>

<section id="ownerPanel" class="panel hidden">
<div class="row"><h2>Owner Dashboard</h2><button class="secondary" id="closeOwner">Close</button></div>
<div id="loginBox">
<h3>Owner Login</h3>
<input id="email" type="email" placeholder="Owner email">
<input id="password" type="password" placeholder="Password">
<button id="loginBtn">Login</button>
</div>
<div id="dashboard" class="hidden">
<div class="row"><h3>Add / Edit Product</h3><button class="secondary" id="logoutBtn">Logout</button></div>
<input id="pid" type="hidden">
<label>Product name</label><input id="pname" placeholder="Product name">
<label>Category</label><select id="pcat"><option>Fashion</option><option>Home</option><option>Beauty</option><option>Accessories</option><option>Other</option></select>
<div class="row">
<div><label>Price (PKR)</label><input id="pprice" type="number" min="1"></div>
<div><label>Old price</label><input id="pold" type="number" min="0"></div>
</div>
<div class="row">
<div><label>Stock quantity</label><input id="pstock" type="number" min="0" step="1" value="10"></div>
<div><label>Flash sale price</label><input id="psale" type="number" min="0"></div>
</div>
<label>Flash sale ending time</label><input id="pend" type="datetime-local">
<label>Image URL</label><input id="pimage" type="url" placeholder="https://...">
<label>Description</label><textarea id="pdesc" rows="3"></textarea>
<button id="saveBtn">Save Product</button><button class="secondary" id="clearBtn">Clear</button>
<h3>Manage Products</h3><div id="manage"></div>
<h3>Orders</h3><div id="orders"></div>
</div>
</section>

<section class="panel">
<h3>Track Your Order</h3>
<div class="row"><input id="trackId" placeholder="Order ID"><button id="trackBtn">Track</button></div>
<p id="trackResult"></p>
</section>
</main>

<footer>Vibemart.pk · Shop smart</footer>

<div id="modal" class="modal hidden">
<div class="modalbox">
<div class="modalhead"><h2 id="modalTitle">Details</h2><button class="secondary" id="modalClose">✕</button></div>
<div id="modalBody"></div>
</div>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import{getFirestore,collection,doc,getDocs,getDoc,addDoc,updateDoc,deleteDoc,query,orderBy,serverTimestamp,runTransaction,setDoc}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyDBz2wmlFK3uwX3TCWnu4lAvQZISuMttEY",
authDomain:"vibemart-store-49d82.firebaseapp.com",
projectId:"vibemart-store-49d82",
storageBucket:"vibemart-store-49d82.firebasestorage.app",
messagingSenderId:"27763181491",
appId:"1:27763181491:web:57cc31f25b0fa531fb6dc6",
measurementId:"G-SRK7BLWPPN"
};

const OWNER_UID="kAFNnhrB3vePCA72WuMVGshQvLV2";
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
let products=[],cart=JSON.parse(localStorage.getItem("vm_cart")||"[]");
let wishlist=JSON.parse(localStorage.getItem("vm_wishlist")||"[]");
let category="All",isOwner=false;
const $=id=>document.getElementById(id);
const cash=n=>"Rs "+Number(n||0).toLocaleString("en-PK");
const safe=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function notice(s){$("message").textContent=s||""}
function stockInfo(p){
 const n=Number(p.stock??10);
 return n<=0?["Out of stock","out"]:n<=3?[`Only ${n} left`,"low"]:[`${n} in stock`,""];
}
function priceOf(p){
 return Number(p.salePrice)>0&&Number(p.salePrice)<Number(p.price)&&p.saleEnds&&new Date(p.saleEnds).getTime()>Date.now()?Number(p.salePrice):Number(p.price);
}
function saveLocal(){
 localStorage.setItem("vm_cart",JSON.stringify(cart));
 localStorage.setItem("vm_wishlist",JSON.stringify(wishlist));
 $("cartCount").textContent=cart.reduce((n,x)=>n+x.qty,0);
 $("wishCount").textContent=wishlist.length;
}
async function loadProducts(){
 try{
  const s=await getDocs(query(collection(db,"products"),orderBy("createdAt","desc")));
  products=s.docs.map(d=>({id:d.id,...d.data()}));
  renderProducts();
  if(isOwner)renderManage();
 }catch(e){$("products").textContent="Products load nahi huay: "+e.message}
}
function renderProducts(){
 const term=$("search").value.toLowerCase();
 const list=products.filter(p=>(category==="All"||p.category===category)&&(`${p.name} ${p.description||""}`).toLowerCase().includes(term));
 $("products").innerHTML=list.length?list.map(p=>{
  const st=stockInfo(p),price=priceOf(p),sale=price<Number(p.price);
  return `<article class="card">
  <img src="${safe(p.imageUrl||"https://placehold.co/500x400?text=Vibemart")}" alt="${safe(p.name)}" onerror="this.src='https://placehold.co/500x400?text=Product'">
  <div class="body"><h3>${safe(p.name)}</h3>
  <div class="price">${cash(price)} ${sale?`<span class="old">${cash(p.price)}</span>`:""}</div>
  ${sale?'<div class="sale">⚡ FLASH SALE</div>':""}
  <div class="stock ${st[1]}">${st[0]}</div>
  <p class="small">${safe(p.description||"")}</p>
  <div class="actions">
  <button ${Number(p.stock??10)<=0?"disabled":""} onclick="addCart('${p.id}')">Add to cart</button>
  <button class="secondary" onclick="toggleWish('${p.id}')">${wishlist.includes(p.id)?"♥":"♡"}</button>
  <button class="secondary" onclick="reviews('${p.id}')">Reviews</button>
  </div></div></article>`;
 }).join(""):"<p>No products found.</p>";
}
window.addCart=id=>{
 const p=products.find(x=>x.id===id);
 if(!p||Number(p.stock??10)<=0)return alert("Product stock mein nahi hai.");
 const x=cart.find(x=>x.id===id);
 if(x)x.qty++;else cart.push({id,qty:1});
 saveLocal();notice("Product cart mein add ho gaya.");
};
window.toggleWish=id=>{
 wishlist=wishlist.includes(id)?wishlist.filter(x=>x!==id):[...wishlist,id];
 saveLocal();renderProducts();
};
function modal(title,html){
 $("modalTitle").textContent=title;$("modalBody").innerHTML=html;$("modal").classList.remove("hidden");
}
$("modalClose").onclick=()=>$("modal").classList.add("hidden");
$("modal").onclick=e=>{if(e.target===$("modal"))$("modal").classList.add("hidden")};
$("search").oninput=renderProducts;
$("categories").onclick=e=>{
 const b=e.target.closest("[data-cat]");if(!b)return;
 category=b.dataset.cat;
 document.querySelectorAll("[data-cat]").forEach(x=>x.classList.toggle("active",x===b));
 renderProducts();
};
$("wishBtn").onclick=()=>{
 const saved=products.filter(p=>wishlist.includes(p.id));
 modal("My Wishlist",saved.length?saved.map(p=>`<div class="item"><b>${safe(p.name)}</b> — ${cash(priceOf(p))}<button onclick="addCart('${p.id}')">Add to cart</button></div>`).join(""):"Wishlist empty.");
};

$("cartBtn").onclick=showCart;
window.changeQty=(id,d)=>{
 const x=cart.find(x=>x.id===id);if(!x)return;
 x.qty+=d;if(x.qty<1)cart=cart.filter(y=>y.id!==id);
 saveLocal();showCart();
};
window.removeCart=id=>{cart=cart.filter(x=>x.id!==id);saveLocal();showCart()};

function showCart(){
 const total=cart.reduce((n,x)=>{let p=products.find(p=>p.id===x.id);return n+(p?priceOf(p)*x.qty:0)},0);
 modal("Shopping Cart",`${cart.length?cart.map(x=>{
  const p=products.find(p=>p.id===x.id);if(!p)return "";
  return `<div class="item"><b>${safe(p.name)}</b><div>${cash(priceOf(p))} × ${x.qty}
  <button class="secondary" onclick="changeQty('${p.id}',-1)">−</button><button class="secondary" onclick="changeQty('${p.id}',1)">+</button><button class="danger" onclick="removeCart('${p.id}')">Remove</button></div></div>`;
 }).join(""):"Cart empty."}
 <h3>Total: ${cash(total)}</h3>
 <button id="checkoutToggle" ${cart.length?"":"disabled"}>Cash on Delivery Checkout</button>
 <div id="checkoutForm" class="hidden">
 <input id="buyerName" placeholder="Full name">
 <input id="buyerPhone" placeholder="Phone number">
 <textarea id="buyerAddress" placeholder="Complete address"></textarea>
 <input id="coupon" placeholder="Coupon code (optional)">
 <button id="placeOrder">Place Order</button></div>`);
 $("checkoutToggle").onclick=()=>$("checkoutForm").classList.toggle("hidden");
 $("placeOrder")?.addEventListener("click",placeOrder);
}

async function placeOrder(){
 const name=$("buyerName").value.trim(),phone=$("buyerPhone").value.trim(),address=$("buyerAddress").value.trim(),code=$("coupon").value.trim().toUpperCase();
 if(name.length<2||phone.length<7||address.length<5)return alert("Name, phone aur address sahi fill karein.");
 const orderRef=doc(collection(db,"orders")),trackRef=doc(db,"tracking",orderRef.id);
 try{
  const result=await runTransaction(db,async tx=>{
   let lines=[],subtotal=0;
   for(const item of cart){
    const ref=doc(db,"products",item.id),snap=await tx.get(ref);
    if(!snap.exists())throw Error("Product ab available nahi.");
    const p={id:item.id,...snap.data()},qty=Number(item.qty),stock=Number(p.stock??10);
    if(!Number.isInteger(qty)||qty<1||stock<qty)throw Error(p.name+": stock available nahi.");
    const unit=priceOf(p);subtotal+=unit*qty;lines.push({ref,p,qty,stock,unit});
   }
   let discount=0,couponCode="";
   if(code){
    const cs=await tx.get(doc(db,"coupons",code));
    if(!cs.exists()||cs.data().active!==true)throw Error("Coupon code valid nahi.");
    const c=cs.data();
    if(subtotal<Number(c.minOrder||0))throw Error("Coupon minimum order poora nahi.");
    discount=c.type==="percent"?subtotal*Math.min(100,Number(c.value))/100:Math.min(subtotal,Number(c.value));
    discount=Math.round(discount);couponCode=code;
   }
   const total=Math.max(0,subtotal-discount);
   for(const x of lines)tx.update(x.ref,{stock:x.stock-x.qty});
   tx.set(orderRef,{name,phone,address,items:lines.map(x=>({id:x.p.id,name:x.p.name,price:x.unit,qty:x.qty,imageUrl:x.p.imageUrl||""})),total,subtotal,discount,couponCode,status:"Pending",createdAt:serverTimestamp()});
   tx.set(trackRef,{status:"Pending",createdAt:serverTimestamp()});
   return {total};
  });
  cart=[];saveLocal();$("modal").classList.add("hidden");
  modal("Order Placed!",`<p>Order successfully place ho gaya.</p><p>Your order ID:</p><p style="overflow-wrap:anywhere"><b>${orderRef.id}</b></p><p>Total: <b>${cash(result.total)}</b></p><button id="copyId">Copy Order ID</button><button id="trackNow">Track order</button>`);
  $("copyId").onclick=()=>navigator.clipboard?.writeText(orderRef.id);
  $("trackNow").onclick=()=>{$("trackId").value=orderRef.id;$("modal").classList.add("hidden");trackOrder()};
 }catch(e){alert("Order place nahi hua: "+e.message)}
}

window.reviews=async id=>{
 const p=products.find(x=>x.id===id);
 modal("Reviews — "+p.name,`<div id="reviewList">Loading...</div><hr>
 <input id="rname" maxlength="40" placeholder="Your name">
 <select id="stars"><option value="5">★★★★★ - 5</option><option value="4">★★★★ - 4</option><option value="3">★★★ - 3</option><option value="2">★★ - 2</option><option value="1">★ - 1</option></select>
 <textarea id="rtext" maxlength="500" placeholder="Write your review"></textarea><button id="submitReview">Submit review</button>`);
 try{
  const s=await getDocs(query(collection(db,"products",id,"reviews"),orderBy("createdAt","desc")));
  $("reviewList").innerHTML=s.empty?"No reviews yet.":s.docs.map(d=>{let r=d.data();return `<div class="item"><b>${safe(r.name)}</b> <span style="color:#e99">${"★".repeat(r.stars)}</span><p>${safe(r.text)}</p></div>`}).join("");
 }catch(e){$("reviewList").textContent="Reviews load nahi huay: "+e.message}
 $("submitReview").onclick=async()=>{
  const name=$("rname").value.trim(),text=$("rtext").value.trim(),stars=Number($("stars").value);
  if(name.length<2||text.length<2)return alert("Name aur review likhein.");
  try{await addDoc(collection(db,"products",id,"reviews"),{name,text,stars,createdAt:serverTimestamp()});alert("Review submit ho gaya.");window.reviews(id)}
  catch(e){alert("Review submit nahi hua: "+e.message)}
 };
};

$("ownerBtn").onclick=()=>$("ownerPanel").classList.toggle("hidden");
$("closeOwner").onclick=()=>$("ownerPanel").classList.add("hidden");
onAuthStateChanged(auth,async user=>{
 isOwner=!!user&&user.uid===OWNER_UID;
 $("loginBox").classList.toggle("hidden",isOwner);
 $("dashboard").classList.toggle("hidden",!isOwner);
 if(user&&!isOwner){await signOut(auth);alert("Owner access nahi hai.")}
 if(isOwner){renderManage();loadOrders()}
});
$("loginBtn").onclick=async()=>{
 try{await signInWithEmailAndPassword(auth,$("email").value,$("password").value)}
 catch(e){alert("Login failed: "+e.message)}
};
$("logoutBtn").onclick=()=>signOut(auth);
$("saveBtn").onclick=saveProduct;
$("clearBtn").onclick=clearForm;

async function saveProduct(){
 if(!isOwner)return;
 const name=$("pname").value.trim(),price=Number($("pprice").value),stock=Number($("pstock").value);
 if(name.length<2||price<=0||!Number.isInteger(stock)||stock<0)return alert("Name, price aur stock sahi fill karein.");
 try{
  const sale=Number($("psale").value)||0,end=$("pend").value;
  const data={name,price,oldPrice:Number($("pold").value)||0,stock,category:$("pcat").value,description:$("pdesc").value.trim(),imageUrl:$("pimage").value.trim(),salePrice:sale,saleEnds:end,updatedAt:serverTimestamp()};
  const id=$("pid").value;
  if(id)await updateDoc(doc(db,"products",id),data);
  else await addDoc(collection(db,"products"),{...data,createdAt:serverTimestamp()});
  clearForm();await loadProducts();alert("Product save ho gaya.");
 }catch(e){alert("Product save nahi hua: "+e.message)}
}
function clearForm(){
 ["pid","pname","pprice","pold","psale","pend","pimage","pdesc"].forEach(id=>$(id).value="");
 $("pstock").value=10;$("saveBtn").textContent="Save Product";
}
function renderManage(){
 $("manage").innerHTML=products.map(p=>`<div class="item"><b>${safe(p.name)}</b> — ${cash(p.price)} — Stock: ${Number(p.stock??10)}
 <button class="secondary" onclick="editProduct('${p.id}')">Edit</button><button class="danger" onclick="deleteProduct('${p.id}')">Delete</button></div>`).join("")||"No products.";
}
window.editProduct=id=>{
 const p=products.find(x=>x.id===id);if(!p)return;
 $("pid").value=id;$("pname").value=p.name||"";$("pcat").value=p.category||"Other";
 $("pprice").value=p.price||"";$("pold").value=p.oldPrice||"";$("pstock").value=Number(p.stock??10);
 $("psale").value=p.salePrice||"";$("pend").value=p.saleEnds||"";$("pimage").value=p.imageUrl||"";$("pdesc").value=p.description||"";
 $("saveBtn").textContent="Update Product";$("ownerPanel").scrollIntoView();
};
window.deleteProduct=async id=>{
 if(!isOwner||!confirm("Product delete karna hai?"))return;
 try{await deleteDoc(doc(db,"products",id));await loadProducts()}catch(e){alert(e.message)}
};
async function loadOrders(){
 if(!isOwner)return;
 try{
  const s=await getDocs(query(collection(db,"orders"),orderBy("createdAt","desc")));
  $("orders").innerHTML=s.empty?"No orders yet.":s.docs.map(d=>{
   const o=d.data();
   return `<div class="item"><b>${safe(o.name)}</b> — ${cash(o.total)}<p>${safe(o.phone)} · ${safe(o.address)}</p><small>Order ID: ${d.id}</small><p>${(o.items||[]).map(x=>`${safe(x.name)} × ${x.qty}`).join(", ")}</p>
   <select id="st-${d.id}">${["Pending","Confirmed","Processing","Shipped","Delivered","Cancelled"].map(x=>`<option ${o.status===x?"selected":""}>${x}</option>`).join("")}</select>
   <button onclick="updateStatus('${d.id}')">Update status</button></div>`;
  }).join("");
 }catch(e){$("orders").textContent="Orders load nahi huay: "+e.message}
}
window.updateStatus=async id=>{
 if(!isOwner)return;
 const status=$("st-"+id).value;
 try{
  await updateDoc(doc(db,"orders",id),{status});
  await setDoc(doc(db,"tracking",id),{status,updatedAt:serverTimestamp()},{merge:true});
  await loadOrders();alert("Status update ho gaya.");
 }catch(e){alert(e.message)}
};
$("trackBtn").onclick=trackOrder;
async function trackOrder(){
 const id=$("trackId").value.trim();if(!id)return $("trackResult").textContent="Order ID likhein.";
 try{const s=await getDoc(doc(db,"tracking",id));$("trackResult").textContent=s.exists()?"Status: "+s.data().status:"Tracking record nahi mila."}
 catch(e){$("trackResult").textContent="Tracking error: "+e.message}
}
saveLocal();loadProducts();
</script>
</body>
</html>
